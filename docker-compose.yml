name: jubayer

services:
  # ---- Laravel API (PHP-FPM) --------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: [./backend/.env]
    volumes:
      - ./backend:/var/www/html:cached
      - vendor:/var/www/html/vendor           # keep vendor/ inside the VM (fast)
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:                              # gate for web/queue/scheduler
      test: ["CMD-SHELL", "php -r 'exit(file_exists(\"/var/www/html/vendor/autoload.php\")?0:1);'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 90s
    networks: [app]

  # ---- nginx (serves the API, proxies php-fpm) --------------------------
  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: { condition: service_healthy }
    networks: [app]

  # ---- Queue worker -----------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --tries=3 --timeout=90 --sleep=1
    env_file: [./backend/.env]
    volumes:
      - ./backend:/var/www/html:cached
      - vendor:/var/www/html/vendor
    depends_on:
      app: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [app]

  # ---- Scheduler (daily lost-customer detection) ------------------------
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    env_file: [./backend/.env]
    volumes:
      - ./backend:/var/www/html:cached
      - vendor:/var/www/html/vendor
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
    networks: [app]

  # ---- MySQL 8 ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sales_crm}
      MYSQL_USER: ${DB_USERNAME:-sales}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro   # creates the *_testing schema
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [app]

  # ---- Redis 7 ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app]

  # ---- React + Vite dev server ------------------------------------------
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - CHOKIDAR_USEPOLLING=true              # macOS bind-mount file watching
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:cached
      - frontend-node-modules:/app/node_modules
    networks: [app]

  # ---- Mailpit (local SMTP sink) ----------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks: [app]

volumes:
  mysql-data:
  redis-data:
  vendor:
  frontend-node-modules:

networks:
  app:
    driver: bridge
